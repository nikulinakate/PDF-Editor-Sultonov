name: iOS validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Project, localization and portable core tests
        run: bash Scripts/validate.sh
      - name: Build app and run PDF round-trip tests on iOS
        run: python3 Scripts/test_ios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
